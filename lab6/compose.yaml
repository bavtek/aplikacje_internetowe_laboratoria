services:
  mysql:
    image: mysql:8.4
    container_name: mysql_lab5
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: lab5
      MYSQL_USER: lab5_user
      MYSQL_PASSWORD: haslo
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql

volumes:
  mysql-data:s